[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cichuan-pool"
version = "0.1.0.dev0"
description = "cichuan-pool — agent-first task pool (local-first CLI core)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "ZhangRui" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Bug Tracking",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
# pool 命令在阶段 A-03（#10847）接线；先占位避免被他人抢注 console script 名
pool = "pool.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
